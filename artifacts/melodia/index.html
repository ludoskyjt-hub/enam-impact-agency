<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>MelodiaPerTe — Votre musique africaine personnalisée</title>
    <meta name="description" content="Découvrez, créez et partagez votre univers musical africain avec MELODIA, votre guide IA musical." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Enam Impact Agency SARL" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#9b4dff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="MelodiaPerTe" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MelodiaPerTe" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- OG -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="MelodiaPerTe" />
    <meta property="og:description" content="Votre musique africaine personnalisée avec MELODIA IA" />
    <meta property="og:image"       content="/icons/icon-512x512.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml"  href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32"  href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />

    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MelodiaPerTe" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144x144.png" />

    <!-- Windows -->
    <meta name="msapplication-TileColor"  content="#9b4dff" />
    <meta name="msapplication-TileImage"  content="/icons/icon-144x144.png" />
    <meta name="msapplication-config"     content="/browserconfig.xml" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
      body { margin: 0; background: #0a0010; font-family: Inter, system-ui, sans-serif; }
      #splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: linear-gradient(135deg, #0a0010, #1a0030);
        z-index: 9999; transition: opacity 0.5s ease;
      }
      #splash .logo {
        font-size: 48px; animation: pulse 1.8s ease-in-out infinite;
      }
      #splash h1 {
        color: #9b4dff; font-size: 24px; font-weight: 800;
        margin: 12px 0 4px; letter-spacing: -0.5px;
      }
      #splash p { color: rgba(155,77,255,0.6); font-size: 13px; }
      @keyframes pulse {
        0%,100% { transform: scale(1) rotate(0deg); }
        50%      { transform: scale(1.1) rotate(5deg); }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="logo">🎵</div>
      <h1>MelodiaPerTe</h1>
      <p>Votre musique africaine personnalisée</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var s = document.getElementById('splash');
          if (s) { s.style.opacity = '0'; setTimeout(function(){ s.remove(); }, 500); }
        }, 800);
      });
    </script>
  </body>
</html>

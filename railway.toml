[build]
builder          = "NIXPACKS"
buildCommand     = "pnpm install --frozen-lockfile && pnpm --filter @workspace/db run push 2>/dev/null || true && pnpm --filter @workspace/api-server run build"

[deploy]
startCommand     = "node --enable-source-maps artifacts/api-server/dist/index.mjs"
healthcheckPath  = "/api/health"
healthcheckTimeout = 300
restartPolicyType  = "ON_FAILURE"
restartPolicyMaxRetries = 3

[environments.production]
numReplicas = 1
